#We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rwt-common"
BBFILE_PATTERN_meta-rwt-common = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rwt-common = "6"

LAYERSERIES_COMPAT_meta-rwt-common = "scarthgap"

# libiio v1.0 (recipes-support/libiio/libiio_1.0.bb) is the libiio for RWT images.
# meta-adi-xilinx's libiio_%.bbappend targets libiio v0 and would override the
# 1.0 recipe's PV, SRCREV (offline), PACKAGECONFIG and sysvinit patch, so mask it.
BBMASK += "meta-adi/meta-adi-xilinx/recipes-support/libiio/"
PREFERRED_VERSION_libiio = "1.0%"
PREFERRED_VERSION_libiio-native = "1.0%"
PREFERRED_VERSION_nativesdk-libiio = "1.0%"
